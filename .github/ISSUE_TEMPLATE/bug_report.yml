name: Bug report
description: Something in PrismTabs behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **This tracker is public.** Please do not include a licence key, an order or invoice ID,
        or anything else you would not want indexed by a search engine. For anything touching
        your purchase, email contact@prismtabs.com instead.

        If a feature stopped working rather than misbehaved, check
        [Licensing & the free trial](https://prismtabs.com/docs#licensing) first — that is
        usually a 30-day trial ending rather than a defect.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before reporting
      options:
        - label: I searched [existing issues](https://github.com/yendrrek/prismtabs-feedback/issues?q=is%3Aissue), including closed ones.
          required: true
        - label: This report contains no licence key, order ID, or other personal data.
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did PrismTabs actually do?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, starting from a freshly opened project if you can.
      placeholder: |
        1. Right-click a tab and choose "Tab Group…"
        2. Pick the blue swatch and name the group "api"
        3. …
    validations:
      required: true

  - type: dropdown
    id: edition
    attributes:
      label: Which edition are you running?
      description: If a Pro feature shows a "start the free trial" link instead of working, you are on the Free tier. Pick "Not sure" if it is unclear.
      options:
        - Free tier (trial has ended)
        - Pro (subscribed)
        - Still in the 30-day trial
        - Not sure
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: PrismTabs version
      description: Settings | Plugins | Installed | PrismTabs.
      placeholder: "1.4.8"
    validations:
      required: true

  - type: input
    id: ide
    attributes:
      label: IDE and build number
      description: "Help | About, then use the copy icon and paste the first line here."
      placeholder: "IntelliJ IDEA 2026.2 (Community Edition), Build #IC-262.1234.56"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Stack trace or IDE log
      description: |
        If the IDE showed an error notification, expand it and paste the stack trace. Otherwise
        leave this blank — Help | Collect Logs and Diagnostic Data produces a zip if one is
        needed later. Check it for anything private before pasting.
      render: text
    validations:
      required: false
